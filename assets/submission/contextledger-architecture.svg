<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">ContextLedger pd architecture and trust boundaries</title><desc id="desc">Four source adapters feed a versioned index. Server identity, current source checks and exact evidence validation guard either reviewed excerpts or optional two-call synthesis. Scoped audit and an isolated fixture lab remain separate.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#557364"/></marker></defs>
<rect width="1600" height="1040" fill="#f6f7f3"/>
<g font-family="Arial, sans-serif" fill="#20322e">
<text x="55" y="65" font-size="36" font-weight="700">ContextLedger · evidence, access and accountability</text>
<text x="55" y="100" font-size="20">Local pd implementation · 14 October 2026 · new model mode not live-validated or deployed</text>
<rect x="400" y="135" width="600" height="710" rx="12" fill="#edf2eb" stroke="#708b7b"/>
<text x="425" y="165" font-size="17">Application trust boundary: prompts and documents cannot grant access</text>

<rect x="50" y="190" width="300" height="125" rx="7" fill="white" stroke="#708b7b"/>
<text x="68" y="220" font-size="21" font-weight="700">Four source adapters</text>
<text x="68" y="248" font-size="17">Confluence · Jira · Slack · Drive</text>
<text x="68" y="272" font-size="17">Read-only / approved test data</text>
<text x="68" y="296" font-size="17">Collection access ≠ user access</text>
<rect x="50" y="375" width="300" height="105" rx="7" fill="white" stroke="#708b7b"/>
<text x="68" y="405" font-size="21" font-weight="700">Incremental publication</text>
<text x="68" y="433" font-size="17">Content / ACL tracked separately</text>
<text x="68" y="457" font-size="17">Publish complete source versions</text>
<rect x="50" y="540" width="300" height="105" rx="7" fill="white" stroke="#708b7b"/>
<text x="68" y="570" font-size="21" font-weight="700">SQLite versioned index</text>
<text x="68" y="598" font-size="17">Local policy prefilter</text>
<text x="68" y="622" font-size="17">Exact text / source IDs</text>
<rect x="425" y="190" width="550" height="95" rx="7" fill="white" stroke="#708b7b"/>
<text x="443" y="220" font-size="21" font-weight="700">Browser + verified server identity</text>
<text x="443" y="248" font-size="17">Source identity ∩ application resource policy</text>
<rect x="425" y="325" width="550" height="100" rx="7" fill="white" stroke="#708b7b"/>
<text x="443" y="355" font-size="21" font-weight="700">Local retrieval</text>
<text x="443" y="383" font-size="17">BM25 · bounded bilingual glossary · exact windows</text>
<text x="443" y="407" font-size="17">One-hop source links require current seed access</text>
<rect x="425" y="465" width="550" height="95" rx="7" fill="white" stroke="#708b7b"/>
<text x="443" y="495" font-size="21" font-weight="700">Current source access + version checks</text>
<text x="443" y="523" font-size="17">Unknown access cannot pass; no model authority</text>
<rect x="425" y="600" width="550" height="105" rx="7" fill="white" stroke="#708b7b"/>
<text x="443" y="630" font-size="21" font-weight="700">Model paths (explicit selection)</text>
<text x="443" y="658" font-size="17">Existing path: reviewed exact source passages</text>
<text x="443" y="682" font-size="17">Optional: per-part draft + separate reasoning review</text>
<rect x="425" y="745" width="550" height="75" rx="7" fill="white" stroke="#708b7b"/>
<text x="443" y="775" font-size="21" font-weight="700">Exact support + final access checks</text>
<text x="443" y="803" font-size="17">Answer, History and previews reauthorize</text>
<rect x="1060" y="250" width="490" height="110" rx="7" fill="white" stroke="#708b7b"/>
<text x="1078" y="280" font-size="21" font-weight="700">Append audit records</text>
<text x="1078" y="308" font-size="17">Identity · query · evidence · authorization · outcome</text>
<text x="1078" y="332" font-size="17">Preparation / sends / usage / storage remain distinct</text>
<rect x="1060" y="410" width="490" height="105" rx="7" fill="white" stroke="#708b7b"/>
<text x="1078" y="440" font-size="21" font-weight="700">Scoped audit explorer</text>
<text x="1078" y="468" font-size="17">Request grouping + observed stage timeline</text>
<text x="1078" y="492" font-size="17">Raw events retained; missing stages not invented</text>
<rect x="1060" y="565" width="490" height="110" rx="7" fill="white" stroke="#708b7b"/>
<text x="1078" y="595" font-size="21" font-weight="700">CodeBuddy checkpoint verifier</text>
<text x="1078" y="623" font-size="17">Offline hash-chain + Ed25519 verification</text>
<text x="1078" y="647" font-size="17">Local custody ≠ independent production custody</text>
<path d="M200 315 V375" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M200 480 V540" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 592 H375 V375 H425" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700 285 V325" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700 425 V465" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700 560 V600" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700 705 V745" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M975 512 H1020 V305 H1060" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M975 785 H1035 V330 H1060" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1305 360 V410" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1305 515 V565" fill="none" stroke="#557364" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1070" y="740" font-size="18">Native update latency, live-model semantics and</text><text x="1070" y="766" font-size="18">independent employee identities remain separate checks.</text>
<rect x="50" y="880" width="1500" height="110" rx="9" fill="#e6ece6" stroke="#708b7b" stroke-dasharray="7 5"/>
<text x="75" y="916" font-size="23" font-weight="700">Separate operator scenario lab · loopback only</text>
<text x="75" y="948" font-size="19">Own in-memory fixtures + SQLite → read → publish version → revoke → inspect audit. Fixed controls; no path to live sources.</text>
<text x="75" y="976" font-size="17">Fake extractive model. Retained operator observations are not employee History. No model fees, native SLA or general security proof.</text>
</g></svg>
