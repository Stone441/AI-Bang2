<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">ContextLedger architecture and trust boundaries</title>
<desc id="desc">The browser and four external knowledge sources connect to a local application boundary containing verified sessions, a versioned index, retrieval and current access checks, validated answers and scoped audit. DeepSeek is a separate external model endpoint. The offline checkpoint verifier and isolated fixture lab are distinct tools.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#376357"/></marker></defs>
<rect width="1600" height="1060" fill="#f6f8f5"/>
<g font-family="Arial, sans-serif" fill="#20342e">
<text x="50" y="65" font-size="38" font-weight="700">ContextLedger system architecture</text>
<text x="50" y="105" font-size="21" fill="#52665e">Read-only sources · current access · reviewed answers · scoped audit</text>
<rect x="400" y="150" width="750" height="710" rx="16" fill="#e9f0e9" stroke="#6b8b77" stroke-width="2"/>
<text x="430" y="186" font-size="19" font-weight="700">LOCAL APPLICATION TRUST BOUNDARY</text>
<rect x="50" y="220" width="300" height="110" rx="9" fill="#fff" stroke="#789181"/>
<text x="70" y="255" font-size="23" font-weight="700">Browser</text>
<text x="70" y="286" font-size="18">Untrusted requests and prompts</text>
<text x="70" y="311" font-size="18">Cannot grant identity or access</text>
<rect x="50" y="430" width="300" height="185" rx="9" fill="#fff" stroke="#789181"/>
<text x="70" y="465" font-size="23" font-weight="700">Knowledge sources</text>
<text x="70" y="500" font-size="20">Confluence · Jira · Slack</text>
<text x="70" y="529" font-size="20">Google Drive</text>
<text x="70" y="568" font-size="18">Read-only scoped adapters</text>
<text x="70" y="595" font-size="18">Collection access ≠ user access</text>
<rect x="430" y="220" width="310" height="110" rx="9" fill="#fff" stroke="#789181"/>
<text x="448" y="256" font-size="22" font-weight="700">Verified server session</text>
<text x="448" y="287" font-size="18">Application identity + policy</text>
<text x="448" y="312" font-size="18">Native source identity mapping</text>
<rect x="790" y="220" width="320" height="110" rx="9" fill="#fff" stroke="#789181"/>
<text x="808" y="256" font-size="22" font-weight="700">Versioned SQLite index</text>
<text x="808" y="287" font-size="18">Incremental content publication</text>
<text x="808" y="312" font-size="18">Source IDs, versions, exact text</text>
<rect x="430" y="430" width="680" height="125" rx="9" fill="#fff" stroke="#789181"/>
<text x="448" y="465" font-size="23" font-weight="700">Bounded retrieval + current source checks</text>
<text x="448" y="501" font-size="19">Local policy prefilter → lexical/BM25 evidence windows</text>
<text x="448" y="532" font-size="19">Native access and version recheck before model dispatch</text>
<rect x="1200" y="430" width="350" height="175" rx="9" fill="#fff" stroke="#789181"/>
<text x="1220" y="466" font-size="23" font-weight="700">External model endpoint</text>
<text x="1220" y="503" font-size="20">DeepSeek Flash</text>
<text x="1220" y="539" font-size="18">Subquestion synthesis + review</text>
<text x="1220" y="566" font-size="18">Permitted synthetic evidence only</text>
<text x="1220" y="591" font-size="18">No authority to grant access</text>
<rect x="430" y="650" width="440" height="125" rx="9" fill="#fff" stroke="#789181"/>
<text x="448" y="686" font-size="23" font-weight="700">Validated answer and evidence</text>
<text x="448" y="721" font-size="18">Exact quote checks + final access checks</text>
<text x="448" y="750" font-size="18">History and previews reauthorize</text>
<rect x="910" y="650" width="200" height="125" rx="9" fill="#fff" stroke="#789181"/>
<text x="928" y="686" font-size="22" font-weight="700">Scoped audit</text>
<text x="928" y="720" font-size="17">Identity · decisions</text>
<text x="928" y="748" font-size="17">Usage · outcome</text>
<text x="430" y="823" font-size="18">Unknown access cannot pass. Model review can make mistakes.</text>
<path d="M350 275H430" fill="none" stroke="#376357" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 525H380V205H950V220" fill="none" stroke="#376357" stroke-width="2" marker-end="url(#arrow)"/>

<path d="M585 330V430" fill="none" stroke="#376357" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M950 330V430" fill="none" stroke="#376357" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1110 475H1200" fill="none" stroke="#376357" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1200 575H1168V625H650V650" fill="none" stroke="#376357" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1010 555V650" fill="none" stroke="#376357" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M870 712H910" fill="none" stroke="#376357" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="915" width="700" height="105" rx="9" fill="#fff" stroke="#789181"/>
<text x="70" y="950" font-size="22" font-weight="700">CodeBuddy offline checkpoint verifier</text>
<text x="70" y="981" font-size="18">Hash chain + Ed25519 · separately trusted checkpoint/public key</text>
<text x="70" y="1006" font-size="17">Local key custody is not independent production custody.</text>
<rect x="800" y="915" width="750" height="105" rx="9" fill="#fff" stroke="#789181" stroke-dasharray="7 5"/>
<text x="820" y="950" font-size="22" font-weight="700">Separate fixture scenario lab</text>
<text x="820" y="981" font-size="18">In-memory fixtures + fake model · version/revocation/audit controls</text>
<text x="820" y="1006" font-size="17">Loopback only; no path to modify connected live sources.</text>
</g></svg>
